<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIYA Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0b1220;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 400px;
      background: #141f32;
      border: 1px solid #263650;
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 15px 45px #0005;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 24px;
      background: linear-gradient(135deg, #38e8b5, #1685f8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
      color: #071526;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #9aabc4;
      font-size: 14px;
      line-height: 1.9;
      margin: 12px 0 26px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #34445e;
      border-radius: 12px;
      background: #0b1527;
      color: white;
      font-size: 15px;
      outline: none;
      direction: rtl;
    }

    input:focus {
      border-color: #38e8b5;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #38e8b5, #1685f8);
      color: #071526;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      color: #38e8b5;
      font-size: 13px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 25px;
      color: #6f829e;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="logo">Z</div>

    <h1>ZIYA Chat</h1>

    <p class="subtitle">
      ارتباطی ساده، سریع و مدرن<br>
      به دنیای ضیا خوش آمدی 💚
    </p>

    <form id="welcomeForm">
      <input
        id="username"
        type="text"
        placeholder="نام خود را وارد کن"
        maxlength="40"
        required
      >

      <button type="submit">ورود به ضیا ←</button>
    </form>

    <div id="message" aria-live="polite"></div>

    <div class="footer">
      ZIYA Chat · ارتباط بدون مرز
    </div>
  </main>

  <script>
    document.getElementById("welcomeForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("username").value.trim();

      if (name) {
        document.getElementById("message").textContent =
          "سلام " + name + " عزیز! به نسخه آزمایشی ضیا خوش آمدی 💚";
      }
    });
  </script>
</body>
</html>
